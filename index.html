const rounds=[{"id": "opening", "title": "Opening Frame", "subtitle": "Truth, memory, fatherhood, and moral responsibility", "read": 90, "text": ["When she was nine, my daughter Kathleen asked if I had ever killed anyone. She knew about the war; she knew I'd been a soldier. \"You keep writing these war stories,\" she said, \"so I guess you must've killed somebody.\" It was a difficult moment, but I did what seemed right, which was to say, \"Of course not,\" and then to take her onto my lap and hold her for a while. Someday, I hope, she'll ask again. But here I want to pretend she's a grown-up. I want to tell her exactly what happened, or what I remember happening, and then I want to say to her that as a little girl she was absolutely right. This is why I keep writing war stories:", "He was a short, slender young man of about twenty. I was afraid of him—afraid of something—and as he passed me on the trail I threw a grenade that exploded at his feet and killed him."], "qs": [{"id": "q1", "skill": "Theme / Synthesis", "stem": "What is the primary effect of beginning with Kathleen’s question before recounting the wartime event?", "opts": ["It makes the story primarily about the daughter’s innocence rather than the narrator’s unresolved response to the past.", "It frames the wartime memory through a present moral problem, making the act of telling part of the narrator’s conflict.", "It delays the central action in order to create suspense about whether the narrator actually killed another person.", "It separates the narrator’s identity as a father from his earlier identity as a soldier by placing them in different times."], "correct": 1, "why": "Kathleen’s question makes narration itself part of the conflict: the narrator must decide what truth can be told and how to live with it."}, {"id": "q2", "skill": "Characterization", "stem": "Which detail most clearly reveals competing obligations within the narrator rather than a single dominant motive?", "opts": ["He remembers the young man’s slight build years later, showing how precisely the event remains fixed in his memory.", "He admits he was afraid during the encounter, challenging the conventional image of a consistently courageous soldier.", "He denies the killing to Kathleen while hoping to tell her later, balancing protection against a need for honesty.", "He continues writing war stories long afterward, showing that the experience remains central to his adult identity."], "correct": 2, "why": "The narrator simultaneously wants to protect Kathleen and to tell her the truth, revealing competing obligations rather than one simple motive."}, {"id": "q3", "skill": "Characterization", "stem": "What is the most significant function of the young man in the opening frame?", "opts": ["He gives concrete human form to the narrator’s abstract guilt, making responsibility personal rather than merely connected to wartime service.", "He functions as an antagonist whose threatening presence explains why the narrator reacts violently despite his later moral uncertainty.", "He represents the narrator’s lost innocence, allowing the story to shift attention away from responsibility and toward emotional trauma.", "He serves as a symbolic parallel to Kathleen, linking youthful innocence with the narrator’s desire to shield others from difficult truths."], "correct": 0, "why": "The young man transforms the narrator’s general identity as a veteran into a specific moral burden attached to one remembered individual."}]}, {"id": "fog", "title": "Waiting in the Fog", "subtitle": "Perspective, natural setting, rising pressure, and humanization", "read": 120, "text": ["Or to go back:", "Shortly after midnight we moved into the ambush site outside My Khe. The whole platoon was there, spread out in the dense brush along the trail, and for five hours nothing at all happened. We were working in two-man teams—one man on guard while the other slept, switching off every two hours—and I remember it was still dark when Kiowa shook me awake for the final watch. The night was foggy and hot. For the first few moments I felt lost, not sure about directions, groping for my helmet and weapon. I reached out and found three grenades and lined them up in front of me; the pins had already been straightened for quick throwing. And then for maybe half an hour I kneeled there and waited. Very gradually, in tiny slivers, dawn began to break through the fog, and from my position in the brush I could see ten or fifteen meters up the trail. The mosquitoes were fierce. I remember slapping at them, wondering if I should wake up Kiowa and ask for some repellent, then thinking it was a bad idea, then looking up and seeing the young man come out of the fog. He wore black clothing and rubber sandals and a gray ammunition belt. His shoulders were slightly stooped, his head cocked to the side as if listening for something. He seemed at ease. He carried his weapon in one hand, muzzle down, moving without any hurry up the center of the trail. There was no sound at all—none that I can remember."], "qs": [{"id": "q4", "skill": "Conflict & Plot", "stem": "How does the contrast between military preparation and ordinary physical discomfort contribute to the passage?", "opts": ["It emphasizes the discipline expected of soldiers, showing how training helps them suppress discomfort and remain prepared for combat.", "It suggests that attention to ordinary details temporarily protects the narrator from recognizing the seriousness of the coming encounter.", "It complicates his soldier identity by placing readiness for violence beside mundane concerns, making the experience less conventionally heroic.", "It presents platoon routine as a stabilizing force that gradually reduces the narrator’s uncertainty before the young man appears."], "correct": 2, "why": "The juxtaposition of grenades with mosquitoes and repellent humanizes the narrator and complicates any simple image of a confident war hero."}, {"id": "q5", "skill": "Point of View & Reliability", "stem": "What is the most important effect of phrases such as “I remember” and “none that I can remember”?", "opts": ["They suggest the narrator deliberately reshapes the event in order to minimize his responsibility for what happened during the ambush.", "They foreground the limits of retrospective narration, reminding readers that the event is reconstructed through memory rather than reproduced objectively.", "They weaken the emotional force of the scene by emphasizing uncertainty about whether many of the described details actually occurred.", "They suggest the narrator’s memory has become more accurate over time because only the most important details remain available to him."], "correct": 1, "why": "The repeated qualifications make the narration intimate but filtered, giving readers access to memory while also signaling the limits of certainty."}, {"id": "q6", "skill": "Setting", "stem": "How does the natural setting function most significantly in this portion of the passage?", "opts": ["The darkness and dense brush conceal the platoon from danger, creating a temporary contrast between safety and the violence that follows.", "The heat and mosquitoes foreground the physical hardship of combat, making bodily discomfort more important than the narrator’s moral uncertainty.", "The gradual arrival of dawn suggests increasing clarity, preparing the narrator to recognize the ethical consequences of his coming action.", "The fog and limited visibility externalize uncertainty, making restricted perception part of the pressure that shapes the narrator’s response."], "correct": 3, "why": "The fog and limited visibility both symbolize uncertainty and materially restrict what the narrator can perceive at a moment of mounting pressure."}, {"id": "q7", "skill": "Characterization", "stem": "Why is the narrator’s detailed observation of the young man especially significant?", "opts": ["His attention to posture, clothing, and movement individualizes the young man, complicating the abstraction of him as merely an enemy.", "His observations reveal tactical awareness, showing how carefully the narrator evaluates the young man as a possible military threat.", "His focus on physical detail creates emotional distance, allowing him to avoid confronting the moral implications of the encounter.", "His description suggests he unconsciously sees the young man as a version of himself, establishing them as deliberate narrative doubles."], "correct": 0, "why": "The individualized physical details humanize the young man before the violence, making the narrator’s later action morally harder to simplify."}]}, {"id": "action", "title": "Moment of Action", "subtitle": "Instinct, moral recognition, characterization, and the major turn", "read": 150, "text": ["In a way, it seemed, he was part of the morning fog, or my own imagination, but there was also the reality of what was happening in my stomach. I had already pulled the pin on a grenade. I had come up to a crouch. It was entirely automatic. I did not hate the young man; I did not see him as the enemy; I did not ponder issues of morality or politics or military duty. I crouched and kept my head low. I tried to swallow whatever was rising from my stomach, which tasted like lemonade, something fruity and sour. I was terrified. There were no thoughts about killing. The grenade was to make him go away—just evaporate—and I leaned back and felt my mind go empty and then felt it fill up again. I had already thrown the grenade before telling myself to throw it. The brush was thick and I had to lob it high, not aiming, and I remember the grenade seeming to freeze above me for an instant, as if a camera had clicked, and I remember ducking down and holding my breath and seeing little wisps of fog rise from the earth. The grenade bounced once and rolled across the trail. I did not hear it, but there must've been a sound, because the young man dropped his weapon and began to run, just two or three quick steps, then he hesitated, swiveling to his right, and he glanced down at the grenade and tried to cover his head but never did. It occurred to me then that he was about to die. I wanted to warn him. The grenade made a popping noise—not soft but not loud either—not what I'd expected—and there was a puff of dust and smoke—a small white puff—and the young man seemed to jerk upward as if pulled by invisible wires. He fell on his back. His rubber sandals had been blown off. There was no wind. He lay at the center of the trail, his right leg bent beneath him, his one eye shut, his other eye a huge star-shaped hole."], "qs": [{"id": "q8", "skill": "Conflict & Plot", "stem": "Which moment first marks the shift from automatic action to conscious recognition of the human consequence?", "opts": ["His pulling the grenade pin, because preparation turns the possibility of violence into an immediate physical reality.", "His throwing the grenade automatically, because instinct overtakes conscious judgment before he can reflect on the action.", "His seeing the young man begin to run, because the encounter changes from still observation to sudden movement.", "His realizing the young man will die, because reflexive action gives way to conscious awareness of its consequence."], "correct": 3, "why": "The explicit realization that the young man is about to die is the first point at which automatic action becomes conscious recognition of its human consequence."}, {"id": "q9", "skill": "Point of View & Reliability", "stem": "What is the most significant effect of the comparison of the grenade to a camera image that seems to “freeze”?", "opts": ["It slows the action to suggest that the narrator is carefully reconsidering the decision before the grenade reaches the trail.", "It makes the moment feel fixed in memory, anticipating the way the event will remain vivid long after the action has ended.", "It creates emotional distance by turning the violence into an image the narrator can observe without responding to it personally.", "It emphasizes the unreality of combat by suggesting that the narrator cannot distinguish remembered events from imagined ones."], "correct": 1, "why": "The camera-like image turns an instant of action into a fixed mental picture, preparing for the story’s later emphasis on persistent memory."}, {"id": "q10", "skill": "Characterization", "stem": "Which interpretation best explains how the young man’s final actions develop his archetypal role in the narrator’s memory?", "opts": ["As a Warrior / Protector, his attempt to shield himself emphasizes trained resistance and makes the encounter more evenly matched.", "As an archetypal Innocent, his instinctive attempt to protect himself emphasizes vulnerability and humanizes him beyond the enemy role.", "As a Rebel, his hesitation and movement suggest resistance to authority and challenge the narrator’s assumptions about enemy soldiers.", "As a Scapegoat, his death allows the narrator to transfer responsibility for the larger violence of war onto one remembered victim."], "correct": 1, "why": "His instinctive attempt to protect himself reinforces the Innocent archetype: he is remembered through vulnerability and humanity rather than simply as an enemy combatant."}, {"id": "q11", "skill": "Characterization", "stem": "What does the sequence from “It was entirely automatic” to “I wanted to warn him” most clearly reveal about the narrator?", "opts": ["His reflexive action and later warning impulse expose a contradiction between bodily instinct and conscious moral response.", "His fear gives way to strategic calculation once he sees how the young man reacts to the grenade in the trail.", "His refusal to view the young man as an enemy causes him to abandon the expectations of his military role.", "His combat training remains so dominant that moral awareness appears only after the immediate danger has completely passed."], "correct": 0, "why": "The sequence places automatic behavior beside an immediate moral impulse, revealing simultaneous and conflicting dimensions of the narrator’s character."}]}, {"id": "aftermath", "title": "Aftermath & Memory", "subtitle": "Hindsight, relationship, unresolved conflict, and theme", "read": 100, "text": ["It was not a matter of live or die. There was no real peril. Almost certainly the young man would have passed by. And it will always be that way.", "Later, I remember, Kiowa tried to tell me that the man would've died anyway. He told me that it was a good kill, that I was a soldier and this was a war, that I should shape up and stop staring and ask myself what the dead man would've done if things were reversed.", "None of it mattered. The words seemed far too complicated. All I could do was gape at the fact of the young man's body.", "Even now I haven't finished sorting it out. Sometimes I forgive myself, other times I don't. In the ordinary hours of life I try not to dwell on it, but now and then, when I'm reading a newspaper or just sitting alone in a room, I'll look up and see the young man coming out of the morning fog. I'll watch him walk toward me, his shoulders slightly stooped, his head cocked to the side, and he'll pass within a few yards of me and suddenly smile at some secret thought and then continue up the trail to where it bends back into the fog."], "qs": [{"id": "q12", "skill": "Conflict & Plot", "stem": "How does the shift from the completed killing to the narrator’s later reflection alter the central conflict?", "opts": ["It replaces the external danger of combat with an ongoing conflict over how the narrator should interpret and judge his own action.", "It turns the conflict toward disagreement with Kiowa because the narrator now sees his friend’s explanation as morally irresponsible.", "It resolves the earlier uncertainty by establishing that the young man would not have attacked the narrator if allowed to pass.", "It shifts the focus from individual responsibility to the larger question of whether soldiers can be morally accountable during war."], "correct": 0, "why": "After the physical event ends, the conflict persists internally as the narrator repeatedly judges, revises, and reimagines what happened."}, {"id": "q13", "skill": "Point of View & Reliability", "stem": "How does the narrator’s present-day perspective shape the ending?", "opts": ["It allows him to reconsider the event more objectively, separating present judgment from the emotional intensity of his younger self.", "It reveals that the memory remains psychologically active because the young man continues to intrude upon otherwise ordinary moments.", "It suggests the account has become less reliable as imagined details increasingly replace the facts the narrator can still remember.", "It creates emotional distance by placing the event safely in the past and emphasizing the years separating memory from present experience."], "correct": 1, "why": "The older narrator’s ordinary present remains vulnerable to the memory, showing that hindsight has expanded reflection without producing closure."}, {"id": "q14", "skill": "Characterization", "stem": "What is Kiowa’s most significant function in the closing section?", "opts": ["His reassurance provides an ethical alternative that gradually enables the narrator to accept the killing as unavoidable in wartime.", "His military reasoning represents the social pressure that originally caused the narrator to act automatically during the ambush.", "His response mainly provides exposition, showing how soldiers commonly explained violence to themselves after difficult and frightening combat experiences.", "His pragmatic logic acts as a foil, exposing how strongly the narrator resists reducing the killing to ordinary military necessity."], "correct": 3, "why": "Kiowa’s pragmatic wartime explanation functions as a foil to the narrator’s continuing inability to make the event morally simple."}, {"id": "q15", "skill": "Theme / Synthesis", "stem": "Which interpretation best describes the narrator’s development by the end of the story?", "opts": ["The ending reveals an unresolved conflict between responsibility and self-forgiveness rather than presenting a completed transformation of the narrator’s identity.", "Repeated reflection gradually produces a stable moral judgment, suggesting the narrator is beginning to move beyond the conflict that once defined him.", "The narrator remains essentially unchanged because his present response repeats the same emotional understanding he held immediately after the killing.", "The recurring memory intensifies guilt until it replaces every competing interpretation of the narrator’s wartime experience and present identity."], "correct": 0, "why": "The ending primarily reveals the persistence of an unresolved moral conflict; it does not present a completed transformation or stable resolution."}]}];
const defaultState=()=>({version:VER,name:'',period:'',screen:{type:'home'},completed:[],orders:{},slotPlan:{},pending:{},first:{},corrections:{},timers:{},timeouts:0,finalDone:false});let state=defaultState(),timerInt=null,runner=null,raf=null;
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}}function load(){try{let s=JSON.parse(localStorage.getItem(STORE));if(s&&s.version===VER)state=Object.assign(defaultState(),s)}catch(e){}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function shuffle(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function shuffleArray(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function ensureSlotPlan(){if(state.slotPlan&&Object.keys(state.slotPlan).length===15)return;const ids=rounds.flatMap(r=>r.qs.map(q=>q.id));const shortSlot=Math.floor(Math.random()*4);let bag=[];for(let s=0;s<4;s++){let count=s===shortSlot?3:4;for(let k=0;k<count;k++)bag.push(s)}bag=shuffleArray(bag);state.slotPlan={};ids.forEach((id,i)=>state.slotPlan[id]=bag[i]);save()}function orderFor(id,n){if(!state.orders[id]){if(n===4&&/^q\d+$/.test(id)){ensureSlotPlan();const q=rounds.flatMap(r=>r.qs).find(x=>x.id===id);const target=state.slotPlan[id];let others=shuffleArray([0,1,2,3].filter(x=>x!==q.correct));others.splice(target,0,q.correct);state.orders[id]=others}else{state.orders[id]=shuffle(n)}save()}return state.orders[id]}
function stopTimer(){if(timerInt)clearInterval(timerInt);timerInt=null}function timerData(id,max){if(!state.timers[id])state.timers[id]={remaining:max,max,expired:false};return state.timers[id]}function label(t){let r=Math.max(0,t.remaining);return t.max>=60?`${Math.floor(r/60)}:${String(r%60).padStart(2,'0')}`:String(r)}function paintTimer(id,max){const el=$('timerRing');if(!el)return;const t=timerData(id,max);el.style.setProperty('--pct',Math.round(t.remaining/t.max*100));el.querySelector('span').textContent=label(t)}
function startTimer(id,max,onExpire){stopTimer();const t=timerData(id,max);paintTimer(id,max);if(state.first[id])return;if(t.expired){onExpire&&onExpire();return}timerInt=setInterval(()=>{t.remaining=Math.max(0,t.remaining-1);save();paintTimer(id,max);if(t.remaining<=0){t.expired=true;stopTimer();state.timeouts++;save();onExpire&&onExpire()}},1000)}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}function pct(){let done=Object.keys(state.first).length;return Math.min(100,Math.round(done/15*100))}function hud(){return `<div class="hud"><div class="brand">AMBUSH: <b>MEMORY UNDER FIRE</b></div><div class="hudright"><span class="student">${esc(state.name)}${state.period?' • '+esc(state.period):''}</span><div class="progress"><i style="--p:${pct()}%"></i></div><button class="hudbtn" id="mapHud">MAP</button><button class="hudbtn" id="resetHud">RESET</button></div></div>`}function title(main,sub,id,max){const t=timerData(id,max);return `<div class="titlebar"><div><div class="eyebrow">AP LITERATURE TIMED PRACTICE</div><h2>${main}</h2><div class="subtitle">${sub}</div></div><div id="timerRing" class="timer"><div><span>${label(t)}</span><small>${max>=60?'remaining':'seconds'}</small></div></div></div>`}
function wireHud(){if($('mapHud'))$('mapHud').onclick=()=>go({type:'map'});if($('resetHud'))$('resetHud').onclick=()=>{if(confirm('Reset all answers, timers, and progress?')){localStorage.removeItem(STORE);state=defaultState();render()}}}function go(s){stopTimer();state.screen=s;save();render();$('screen').scrollTop=0}
function home(){$('screen').innerHTML=`<div class="home"><div class="card homecard"><div class="hero"><h1>AMBUSH</h1><h2>MEMORY UNDER FIRE</h2><p>AP Literature Timed Practice • Tim O’Brien</p></div><div class="homebody"><div class="box"><h3>Your Mission</h3><ul><li>Re-read four sections of the story before each checkpoint.</li><li>Answer 15 AP Literature-level questions over characterization, point of view & narrator reliability, setting, conflict/plot, and theme.</li><li>Each question has <b>1 minute 15 seconds</b>. The countdown remains visible while you work.</li><li>If time expires, finish the question and submit your first response before moving on.</li></ul></div><div class="box entry"><h3>Enter the Field</h3><input id="name" maxlength="60" placeholder="Student name" value="${esc(state.name)}"><select id="period"><option value="">Class / Period (optional)</option>${['1st','2nd','3rd','4th','5th','6th','7th'].map(x=>`<option ${state.period===x?'selected':''}>${x}</option>`).join('')}</select><button id="start" class="btn gold">BEGIN TIMED PRACTICE</button></div></div></div></div>`;$('start').onclick=()=>{let n=$('name').value.trim();if(!n)return toast('Enter your name first.');state.name=n;state.period=$('period').value;save();go({type:'map'})}}
function map(){const firstIncomplete=rounds.findIndex(r=>!state.completed.includes(r.id));$('screen').innerHTML=hud()+`<div class="card map"><h2>Mission Map</h2><p>Complete each checkpoint in order. The excerpt remains visible beside every timed question.</p><div class="missions">${rounds.map((r,i)=>{let done=state.completed.includes(r.id),locked=i>0&&!state.completed.includes(rounds[i-1].id);return `<div class="mission ${done?'done':''} ${locked?'locked':''}"><div class="num">${i+1}</div><h3>${r.title}</h3><p>${r.subtitle}</p><span class="tag">${r.qs.length} QUESTIONS • ${r.read}s RE-READ</span><button class="btn ${done?'teal':'gold'}" data-i="${i}" ${locked?'disabled':''}>${done?'COMPLETED':'ENTER CHECKPOINT'}</button></div>`}).join('')}</div>${firstIncomplete<0?`<div style="text-align:center;margin-top:20px"><button class="btn rust" id="reviewBtn">BEGIN REQUIRED REVIEW</button></div>`:''}</div>`;wireHud();document.querySelectorAll('.mission button').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;if(!state.completed.includes(rounds[i].id))go({type:'read',round:i})});if($('reviewBtn'))$('reviewBtn').onclick=()=>beginCorrections()}
function passageHTML(r){return `<div class="passage"><div class="eyebrow">SELECTED EXCERPT</div><h3>${r.title}</h3><div class="text">${r.text.map(p=>`<p>${p}</p>`).join('')}</div></div>`}
function readRound(i){const r=rounds[i],id='read-'+r.id;$('screen').innerHTML=hud()+title(r.title,`${r.subtitle} • Re-read before answering.`,id,r.read)+`<div class="layout">${passageHTML(r)}<div class="panel"><div class="eyebrow">RE-READ WINDOW</div><h3>Read for evidence.</h3><div class="readnote">Focus on how the passage develops <b>characterization</b>, <b>point of view & narrator reliability</b>, <b>setting</b>, <b>conflict/plot</b>, and <b>theme</b>. The excerpt will remain visible beside every question.</div><div class="reveal"><b>This round is timed for reading, but you may begin the questions as soon as you are ready.</b></div><button id="beginQ" class="btn gold">I'M READY — BEGIN QUESTIONS</button></div></div>`;wireHud();startTimer(id,r.read,()=>toast('Re-read window ended. Begin when ready.'));$('beginQ').onclick=()=>go({type:'quiz',round:i,q:0})}
function quiz(i,qi){const r=rounds[i],q=r.qs[qi];if(!q){if(!state.completed.includes(r.id))state.completed.push(r.id);save();if(i<rounds.length-1)return go({type:'read',round:i+1});return beginCorrections()}const order=orderFor(q.id,4),sel=state.pending[q.id]===undefined?null:+state.pending[q.id];if(state.first[q.id])return go({type:'quiz',round:i,q:qi+1});$('screen').innerHTML=hud()+title(r.title,`Question ${qi+1} of ${r.qs.length} • ${q.skill}`,q.id,75)+`<div class="layout">${passageHTML(r)}<div class="panel"><div class="qmeta"><span class="skill">${q.skill}</span><span>FIRST RESPONSE</span></div><div class="stem">${q.stem}</div><div class="options">${order.map((oi,pos)=>`<button class="option ${sel===oi?'selected':''}" data-oi="${oi}"><span class="letter">${'ABCD'[pos]}</span><span class="copy">${q.opts[oi]}</span></button>`).join('')}</div><div id="fb" class="feedback"></div><div class="qactions"><button id="submitQ" class="btn gold" ${sel===null?'disabled':''}>SUBMIT ANSWER</button></div></div></div>`;wireHud();document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{state.pending[q.id]=+b.dataset.oi;save();quiz(i,qi)});$('submitQ').onclick=()=>submitFirst(q,i,qi);startTimer(q.id,75,()=>{let fb=$('fb');if(fb){fb.className='feedback show';fb.innerHTML='<b>Time expired.</b> Finish this question and submit your first response.'}let ring=$('timerRing');if(ring)ring.classList.add('expired')})}
function recordFirst(q,selected,timedOut=false){if(!state.first[q.id])state.first[q.id]={correct:selected===q.correct,selected,skill:q.skill,round:rounds.find(r=>r.qs.includes(q))?.title||'',timedOut}}
function submitFirst(q,i,qi){let sel=state.pending[q.id];if(sel===undefined)return;const t=timerData(q.id,75),late=!!t.expired;stopTimer();recordFirst(q,+sel,late);delete state.pending[q.id];save();go({type:'quiz',round:i,q:qi+1})}
function missedIds(){return rounds.flatMap(r=>r.qs).filter(q=>state.first[q.id]&&!state.first[q.id].correct&&!state.corrections[q.id]?.complete).map(q=>q.id)}
function beginCorrections(){let ids=missedIds();if(!ids.length)return go({type:'report'});go({type:'correct',id:ids[0]})}
function correction(id){let q=null,r=null;for(const rr of rounds){let f=rr.qs.find(x=>x.id===id);if(f){q=f;r=rr;break}}if(!q)return beginCorrections();const order=orderFor(q.id,4),sel=state.pending['c-'+q.id]===undefined?null:+state.pending['c-'+q.id],c=state.corrections[q.id]||{attempts:0,complete:false};$('screen').innerHTML=hud()+`<div class="titlebar"><div><div class="eyebrow">REQUIRED CORRECTION</div><h2>${r.title}</h2><div class="subtitle">Re-read the evidence and correct the missed item.</div></div><div class="timer"><div><span>${missedIds().length}</span><small>remaining</small></div></div></div><div class="layout">${passageHTML(r)}<div class="panel"><div class="qmeta"><span class="skill">${q.skill}</span><span>CORRECTION MODE</span></div><div class="stem">${q.stem}</div><div class="options">${order.map((oi,pos)=>`<button class="option ${sel===oi?'selected':''}" data-oi="${oi}"><span class="letter">${'ABCD'[pos]}</span><span class="copy">${q.opts[oi]}</span></button>`).join('')}</div><div id="fb" class="feedback"></div><div class="qactions"><button id="submitC" class="btn gold" ${sel===null?'disabled':''}>CHECK CORRECTION</button></div></div></div>`;wireHud();document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{state.pending['c-'+q.id]=+b.dataset.oi;save();correction(id)});$('submitC').onclick=()=>{let pick=state.pending['c-'+q.id];if(pick===undefined)return;let cc=state.corrections[q.id]||{attempts:0,complete:false};cc.attempts++;if(+pick===q.correct){cc.complete=true;state.corrections[q.id]=cc;delete state.pending['c-'+q.id];save();let fb=$('fb');fb.className='feedback show good';fb.innerHTML=`<b>Correction complete.</b> ${q.why}`;setTimeout(()=>beginCorrections(),650)}else{state.corrections[q.id]=cc;save();let fb=$('fb');fb.className='feedback show bad';fb.innerHTML='<b>Not yet.</b> Return to the passage and try again.'}}}
function breakScreen(i){if(i<rounds.length-1)return go({type:'read',round:i+1});beginCorrections()}
function report(){let missing=missedIds();if(missing.length)return go({type:'correct',id:missing[0]});state.finalDone=true;save();let vals=Object.values(state.first),total=15,within=vals.filter(x=>x.correct&&!x.timedOut).length,allFirst=vals.filter(x=>x.correct).length,withinPct=Math.round(within/total*100),allPct=Math.round(allFirst/total*100),timeouts=vals.filter(x=>x.timedOut).length,corr=Object.values(state.corrections).filter(x=>x.complete).length,need=vals.filter(x=>!x.correct).length;const stat=s=>{let a=vals.filter(x=>x.skill===s),c=a.filter(x=>x.correct).length,w=a.filter(x=>x.correct&&!x.timedOut).length;return{n:a.length,c,w,p:a.length?Math.round(c/a.length*100):0}};$('screen').innerHTML=`<div class="card report"><h1>AMBUSH — Final Accuracy Report</h1><p><b>${esc(state.name)}</b>${state.period?' • '+esc(state.period):''}</p><div class="summary"><div class="metric"><div class="big">${withinPct}%</div><small>First-time accuracy within 75 seconds<br>${within}/${total}</small></div><div class="metric"><div class="big">${allPct}%</div><small>First-time accuracy including late responses<br>${allFirst}/${total}</small></div><div class="metric"><div class="big">${timeouts}</div><small>Questions answered after time expired</small></div><div class="metric"><div class="big">${corr}/${need}</div><small>Required corrections completed</small></div></div><div class="skillgrid">${skills.map(sk=>{let x=stat(sk);return `<div class="skillbox"><b>${x.p}%</b><small>${sk}<br>${x.c}/${x.n} first-attempt correct<br>${x.w}/${x.n} correct within time</small></div>`}).join('')}</div><p style="margin-top:18px"><b>Diagnostic note:</b> Compare within-time accuracy with overall first-attempt accuracy to distinguish pacing from content mastery. Corrections are completed only after the timed first pass.</p><div class="actions"><button id="printR" class="btn teal">PRINT / SAVE PDF</button><button id="downloadR" class="btn gold">DOWNLOAD REPORT</button><button id="restartR" class="btn rust">RESTART</button></div></div>`;$('printR').onclick=()=>window.print();$('restartR').onclick=()=>{if(confirm('Restart from the beginning?')){localStorage.removeItem(STORE);state=defaultState();render()}};$('downloadR').onclick=()=>downloadReport()}
function downloadReport(){let vals=Object.values(state.first),within=vals.filter(x=>x.correct&&!x.timedOut).length,allFirst=vals.filter(x=>x.correct).length,withinPct=Math.round(within/15*100),allPct=Math.round(allFirst/15*100);let h=`<!doctype html><meta charset="utf-8"><title>Ambush Timed Practice Report</title><style>body{font-family:Arial;max-width:900px;margin:40px auto}table{border-collapse:collapse;width:100%}td,th{border:1px solid #aaa;padding:8px}.timer.expired{box-shadow:0 0 0 3px rgba(255,75,120,.35),0 0 28px rgba(255,75,120,.35)}.timer.expired span{color:#ff6b7f}</style><h1>Ambush — AP Literature Timed Practice</h1><p><b>Student:</b> ${esc(state.name)} ${esc(state.period)}</p><p><b>First-time accuracy within 75 seconds:</b> ${withinPct}% (${within}/15)</p><p><b>First-time accuracy including late responses:</b> ${allPct}% (${allFirst}/15)</p><table><tr><th>Skill</th><th>Checkpoint</th><th>First response</th><th>After time?</th><th>Correction completed?</th></tr>${rounds.flatMap(r=>r.qs.map(q=>({q,round:r.title}))).map(({q,round})=>{let v=state.first[q.id]||{};return `<tr><td>${esc(q.skill)}</td><td>${esc(round)}</td><td>${v.correct?'Correct':'Incorrect'}</td><td>${v.timedOut?'Yes':'No'}</td><td>${state.corrections[q.id]?.complete?'Yes':v.correct?'Not needed':'No'}</td></tr>`}).join('')}</table>`;let blob=new Blob([h],{type:'text/html'}),u=URL.createObjectURL(blob),aa=document.createElement('a');aa.href=u;aa.download='Ambush_Timed_Practice_Report_'+state.name.replace(/[^a-z0-9]+/gi,'_')+'.html';aa.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function render(){let s=state.screen;if(s.type==='home')return home();if(s.type==='map')return map();if(s.type==='read')return readRound(s.round||0);if(s.type==='quiz')return quiz(s.round||0,s.q||0);if(s.type==='break')return breakScreen(s.round||0);if(s.type==='correct')return correction(s.id);if(s.type==='report')return report();home()}load();render();})();</script></body></html>
